# ─── HTTP → HTTPS redirect + ACME challenge ─────────────────────────────────
server {
    listen 80;
    server_name _;

    # Let's Encrypt challenge (webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    # NOTE: Change 'bebetter.example.com' after buying your domain,
    # then re-issue the cert with certbot (see DEPLOYMENT.md).
    ssl_certificate     /etc/letsencrypt/live/bebetter.quest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bebetter.quest/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Post uploads (images up to 25MB)
    client_max_body_size 25m;

    # ─── Backend API ─────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ─── User uploaded media ─────────────────────────────────────────────────
    # Served directly from the shared uploads volume (avoids proxying to backend)
    location /uploads/ {
        alias /var/www/uploads/;
        add_header Cache-Control "public, max-age=604800";
    }

    # ─── Angular SPA ─────────────────────────────────────────────────────────
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
