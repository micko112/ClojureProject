services:

  # ─── Datomic transactor (dev protocol, H2 storage) ──────────────────────────
  datomic:
    build:
      context: ./datomic-transactor
    image: bebetter-datomic
    container_name: bebetter-datomic
    volumes:
      - datomic_data:/var/lib/datomic
    ports:
      - "4334:4334"
      - "4335:4335"
      - "4336:4336"
    healthcheck:
      test: ["CMD-SHELL", "netstat -tln | grep -q 4334 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ─── Clojure backend (Ring + Jetty) ──────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: bebetter-backend
    container_name: bebetter-backend
    environment:
      DATOMIC_URI: "datomic:dev://datomic:4334/bebetter?password=bebetter_datomic_secret"
      PORT: "3000"
      BEBETTER_SEED: "${BEBETTER_SEED:-false}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      # Media storage: leave empty to store uploads on local disk (uploads/).
      # To test S3 locally: `docker compose --profile minio up` and set e.g.
      #   S3_ENDPOINT=http://minio:9000 S3_BUCKET=bebetter-media
      #   S3_ACCESS_KEY=minioadmin S3_SECRET_KEY=minioadmin
      #   MEDIA_PUBLIC_BASE_URL=http://localhost:9000/bebetter-media
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
      S3_REGION: "${S3_REGION:-}"
      S3_PREFIX: "${S3_PREFIX:-}"
      MEDIA_PUBLIC_BASE_URL: "${MEDIA_PUBLIC_BASE_URL:-}"
      # Activity suggestions from photos. Set ML_URL= (empty) to turn them off;
      # uploads keep working when the ml service is down either way.
      ML_URL: "${ML_URL-http://ml:8000}"
      ML_TOKEN: "${ML_TOKEN:-}"
      # Comma-separated usernames allowed to call /api/vision/retrain and /status.
      ADMIN_USERNAMES: "${ADMIN_USERNAMES:-}"
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "3000:3000"
    depends_on:
      datomic:
        condition: service_started
      ml:
        condition: service_started

  # ─── Activity classifier (Python: CLIP via ONNX Runtime + trained head) ──────
  # See ml/README.md. The trained head lives on the ml_data volume.
  ml:
    build:
      context: ./ml
    image: bebetter-ml
    container_name: bebetter-ml
    environment:
      ML_TOKEN: "${ML_TOKEN:-}"
    volumes:
      - ml_data:/data
    ports:
      - "8000:8000"

  # ─── Angular frontend (nginx serving built SPA) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
    image: bebetter-frontend
    container_name: bebetter-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

  # ─── Optional: MinIO (local S3-compatible storage) ─────────────────────────
  # Started only with `docker compose --profile minio up`.
  # Console: http://localhost:9001 (minioadmin / minioadmin)
  minio:
    image: minio/minio:latest
    container_name: bebetter-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    profiles:
      - minio

  # Creates the bucket and makes objects publicly readable (like an R2 public bucket).
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/bebetter-media;
      mc anonymous set download local/bebetter-media;
      "
    profiles:
      - minio

volumes:
  datomic_data:
  uploads_data:
  minio_data:
  ml_data:
