services:

  # ─── Datomic transactor ──────────────────────────────────────────────────────
  datomic:
    image: ghcr.io/${IMAGE_OWNER:-micko112}/bebetter-datomic:${IMAGE_TAG:-latest}
    container_name: bebetter-datomic
    restart: unless-stopped
    volumes:
      - datomic_data:/var/lib/datomic
    healthcheck:
      test: ["CMD-SHELL", "netstat -tln 2>/dev/null | grep -q 4334 || ss -tln | grep -q 4334 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ─── Clojure backend ─────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/${IMAGE_OWNER:-micko112}/bebetter-backend:${IMAGE_TAG:-latest}
    container_name: bebetter-backend
    restart: unless-stopped
    env_file: ./.env
    environment:
      DATOMIC_URI: "datomic:dev://datomic:4334/bebetter"
      PORT: "3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      datomic:
        condition: service_started

  # ─── Angular frontend ────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/${IMAGE_OWNER:-micko112}/bebetter-frontend:${IMAGE_TAG:-latest}
    container_name: bebetter-frontend
    restart: unless-stopped
    depends_on:
      - backend

  # ─── Nginx reverse proxy (SSL termination) ───────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: bebetter-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      - uploads_data:/var/www/uploads:ro
    depends_on:
      - backend
      - frontend

  # ─── Certbot (Let's Encrypt) ─────────────────────────────────────────────────
  # One-time cert issue:
  #   docker compose -f docker-compose.prod.yml run --rm certbot
  # Renewal (auto every 60 days recommended cron):
  #   docker compose -f docker-compose.prod.yml run --rm certbot renew
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    command: >
      certonly --webroot --webroot-path=/var/www/certbot
      --email ${CERTBOT_EMAIL} --agree-tos --no-eff-email
      -d ${DOMAIN}
    profiles:
      - certbot

volumes:
  datomic_data:
  uploads_data:
  certbot-conf:
  certbot-www:
