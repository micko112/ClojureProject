## Datomic dev transactor — file-backed H2 storage
## Persisted under /var/lib/datomic (volume mount).

protocol=dev
host=0.0.0.0
port=4334
alt-host=datomic

## Client-visible URIs:
##   datomic:dev://<storage-datomic-password>@datomic:4334/<db-name>

license-key=

## Dev storage backed by embedded H2
data-dir=/var/lib/datomic/data
log-dir=/var/lib/datomic/log

## Storage passwords — REQUIRED for remote peer connections.
## Without these, H2 rejects all non-localhost connections.
## These are dev-only credentials on the internal Docker network only.
storage-admin-password=bebetter_admin_secret
storage-datomic-password=bebetter_datomic_secret

memory-index-threshold=32m
memory-index-max=256m
object-cache-max=128m
