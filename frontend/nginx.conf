server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Local docker compose: forward API, WebSocket and uploads to the backend.
    # (In production the outer nginx in nginx.prod.conf routes these first.)
    # Resolving at request time keeps nginx starting even if backend is down.
    resolver 127.0.0.11 valid=30s;
    set $backend http://backend:3000;
    client_max_body_size 120m;

    location ^~ /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location ^~ /uploads/ {
        proxy_pass $backend;
    }

    # Angular SPA — sve rute idu na index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Agresivno keširanje statičkih fajlova
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
