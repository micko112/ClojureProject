<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Product name: keep in sync with src/app/core/brand.ts (BRAND.name) -->
  <title>BeBetter</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="BeBetter - Post one photo or video of your progress every day. No filters needed. Only your effort counts.">
  <meta name="application-name" content="BeBetter">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <!-- iOS / installable PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BeBetter">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet">
  <script>
    // Apply the theme before first paint: explicit choice wins, else follow the OS.
    (function () {
      var t = null;
      try { t = localStorage.getItem('bb-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    /* Splash background while the app boots (matches manifest background_color) */
    html { background: #0a0a0a; }
    html[data-theme="light"] { background: #f4f4f5; }
  </style>
  <!-- OAuth SDKs — replace the IDs below with your own app credentials -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    window.fbAsyncInit = function() {
      FB.init({ appId: 'REPLACE_WITH_FACEBOOK_APP_ID', cookie: true, xfbml: false, version: 'v19.0' });
    };
  </script>
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to use BeBetter.</noscript>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
