<div class="pd-page">
  @if (loading) {
    <div class="pd-skel"></div>
  } @else if (post) {
    <app-post-view [post]="post" (removed)="onRemoved($event)"></app-post-view>
    <div class="pd-more">
      <a [routerLink]="['/profile', post.author.username]">More posts from <strong>{{ post.author.username }}</strong></a>
    </div>
  } @else {
    <div class="pd-empty">
      <h2>Sorry, this post isn't available.</h2>
      <p>The link may be broken, or the post may have been removed. <a routerLink="/feed">Go back to the feed.</a></p>
    </div>
  }
</div>
