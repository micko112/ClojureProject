<div class="login-page">
  <div class="login-card">
    <h1>BeBetter</h1>
    <p class="subtitle">Track effort. Build discipline. Stay consistent.</p>

    <div class="mode-tabs">
      <button [class.active]="mode === 'login'" (click)="mode = 'login'; error = ''">Login</button>
      <button [class.active]="mode === 'register'" (click)="mode = 'register'; error = ''">Register</button>
    </div>

    @if (mode === 'login') {
      <div class="seed-users">
        <p class="seed-label">Quick login:</p>
        <div class="seed-grid">
          @for (u of seedUsers; track u) {
            <button class="seed-btn" [class.selected]="selectedUser === u" (click)="selectUser(u)">
              {{ u }}
            </button>
          }
        </div>
      </div>
    }

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label>Username</label>
        <input type="text" [(ngModel)]="username" name="username" placeholder="Enter username" required />
      </div>
      @if (showPasswordFor || mode === 'register') {
        <div class="form-group">
          <label>Password</label>
          <input type="password" [(ngModel)]="password" name="password"
            [placeholder]="mode === 'register' ? 'Min 6 characters' : 'Enter password'"
            [required]="mode === 'register'" />
        </div>
      }
      @if (error) {
        <div class="error-msg">{{ error }}</div>
      }
      <button type="submit" class="submit-btn" [disabled]="loading || oauthLoading || !username.trim() || (mode === 'register' && password.length < 6)">
        {{ loading ? 'Loading...' : (mode === 'login' ? 'Login' : 'Register') }}
      </button>
    </form>

    @if (mode === 'login') {
      <div class="oauth-divider"><span>or continue with</span></div>

      <div class="oauth-buttons">
        <div id="google-btn" class="google-btn-wrap"></div>

        <button class="fb-btn" (click)="loginWithFacebook()" [disabled]="oauthLoading">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877f2">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          {{ oauthLoading ? 'Loading...' : 'Continue with Facebook' }}
        </button>
      </div>
    }

    <div class="legal-links">
      <a routerLink="/privacy">Privacy Policy</a>
      <span>·</span>
      <a routerLink="/terms">Terms of Service</a>
    </div>
  </div>
</div>
