<div class="pm-overlay" (click)="close()">
  <button type="button" class="pm-close" aria-label="Close" (click)="close()">
    <span class="material-icons">close</span>
  </button>
  @if (loading) {
    <div class="pm-spin"></div>
  } @else if (post) {
    <div class="pm-box" (click)="$event.stopPropagation()">
      <app-post-view [post]="post" [inModal]="true" (navigate)="close()" (removed)="onRemoved($event)"></app-post-view>
    </div>
  } @else if (failed) {
    <div class="pm-error" (click)="$event.stopPropagation()">This post isn't available.</div>
  }
</div>
